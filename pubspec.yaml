name: exmr
description: "PassForge — Simulate. Study. Pass. Philippine board exam mock simulator."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/passforge_icon_1024.png
  adaptive_icon_background: "#2E1065"
  adaptive_icon_foreground: assets/branding/passforge_icon_1024.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/branding/passforge_icon_1024.png
    icon_size: 256

flutter_native_splash:
  color: "#2E1065"
  image: assets/branding/passforge_icon_1024.png
  android: true
  ios: true
  android_12:
    color: "#2E1065"
    image: assets/branding/passforge_icon_1024.png
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/branding/
